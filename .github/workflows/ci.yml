name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests run against a real, disposable PostgreSQL (docs/DEPLOYMENT.md, "Test database").
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veyra_test
          POSTGRES_PASSWORD: veyra_test
          POSTGRES_DB: veyra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veyra_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://veyra_test:veyra_test@127.0.0.1:5432/veyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Known vulnerabilities in the dependencies that ship (production). Dev-only tooling findings
      # are reviewed separately (docs/SECURITY.md "Dependency and secret scanning").
      - run: npm run audit:deps
